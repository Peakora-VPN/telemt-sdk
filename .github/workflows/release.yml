name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/telemt-sdk/
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Verify the tag matches both distributions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --no-project python scripts/check_release.py
      - name: Prepare release overview
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          uv run --no-project python -m scripts.release_notes \
            --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$RUNNER_TEMP/release-notes.md"
      - name: Publish to PyPI using Trusted Publishing
        run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            args=(--verify-tag --generate-notes
              --title "telemt-sdk ${RELEASE_TAG}"
              --notes-file "$RUNNER_TEMP/release-notes.md")
            if [[ "$RELEASE_TAG" =~ (a|b|rc)[0-9]+$ ]]; then
              args+=(--prerelease --latest=false)
            fi
            gh release create "$RELEASE_TAG" dist/* "${args[@]}"
          fi
